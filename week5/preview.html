<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../style.css">

  <style>

    html, body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    .meme {

      width: 100%;

      height: 100%;

      margin: 0;

    }

    .meme-image {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }

    .meme-text {

      display: none;

    }

    button {

      display: none;

    }

  </style>

</head>

<body>

  <div class="meme">

    <img

      class="meme-image"

      id="meme-image"

      src=""

      alt="Meme Generator Preview"

    >

    <p class="meme-text" id="meme-text"></p>

  </div>

  <script>

    window.previewMode = true;

  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="script.js"></script>

</body>

</html>
